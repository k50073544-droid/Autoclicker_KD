name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Prepare project
        run: |
          mkdir build-src && cd build-src
          unzip -q ../autoclicker.zip
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AutoClicker"
          include ":app"
          EOF
          cat > build.gradle <<'EOF'
          plugins { id "com.android.application" version "8.5.2" apply false }
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id "com.android.application" }
          android {
              namespace "com.weker.autoclicker"
              compileSdk 34
              defaultConfig {
                  applicationId "com.weker.autoclicker"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
      - name: Build
        working-directory: build-src
        run: gradle assembleDebug --no-daemon
      - run: cp build-src/app/build/outputs/apk/debug/app-debug.apk AutoClicker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-apk
          path: AutoClicker.apk
